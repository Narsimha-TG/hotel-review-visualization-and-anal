<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Review Visualization and Analysis Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">

    <!-- Header / Navbar -->
    <header class="bg-white dark:bg-slate-800 shadow-sm sticky top-0 z-50 border-b border-slate-200 dark:border-slate-700">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-600 text-white p-2.5 rounded-lg shadow-md">
                    <i class="fa-solid fa-hotel text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Hotel Analytics Dashboard</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Insights & Sentiment Analysis</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <!-- Theme Toggle Button -->
                <button id="themeToggle" onclick="toggleTheme()" class="p-2.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                    <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
                </button>
                <button onclick="fetchDashboardData()" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm flex items-center space-x-2">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>Refresh Data</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">

        <!-- KPI Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <!-- Total Reviews -->
            <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500 dark:text-slate-400">Total Reviews</p>
                    <h3 id="kpiTotalReviews" class="text-2xl font-bold mt-1">--</h3>
                </div>
                <div class="p-3 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-lg">
                    <i class="fa-solid fa-comments text-xl"></i>
                </div>
            </div>
            <!-- Average Rating -->
            <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500 dark:text-slate-400">Average Rating</p>
                    <h3 id="kpiAvgRating" class="text-2xl font-bold mt-1">--</h3>
                </div>
                <div class="p-3 bg-amber-50 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 rounded-lg">
                    <i class="fa-solid fa-star text-xl"></i>
                </div>
            </div>
            <!-- Positive Sentiment -->
            <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500 dark:text-slate-400">Positive Sentiment</p>
                    <h3 id="kpiPositive" class="text-2xl font-bold mt-1 text-emerald-600 dark:text-emerald-400">--</h3>
                </div>
                <div class="p-3 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 rounded-lg">
                    <i class="fa-solid fa-face-smile text-xl"></i>
                </div>
            </div>
            <!-- Negative Sentiment -->
            <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500 dark:text-slate-400">Negative Sentiment</p>
                    <h3 id="kpiNegative" class="text-2xl font-bold mt-1 text-rose-600 dark:text-rose-400">--</h3>
                </div>
                <div class="p-3 bg-rose-50 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 rounded-lg">
                    <i class="fa-solid fa-face-frown text-xl"></i>
                </div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Sentiment Breakdown Chart -->
            <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                <h3 class="text-lg font-semibold mb-4">Sentiment Distribution</h3>
                <div class="relative h-72 flex justify-center">
                    <canvas id="sentimentChart"></canvas>
                </div>
            </div>

            <!-- Ratings Overview Chart -->
            <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                <h3 class="text-lg font-semibold mb-4">Rating Breakdown</h3>
                <div class="relative h-72">
                    <canvas id="ratingChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Add Review Form & Filter Section -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Add Review Form -->
            <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                <h3 class="text-lg font-semibold mb-4">Add New Review</h3>
                <form id="reviewForm" onsubmit="submitReview(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Hotel Name</label>
                        <input type="text" id="hotelName" required class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Rating (1-5)</label>
                        <select id="reviewRating" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                            <option value="5">5 - Excellent</option>
                            <option value="4">4 - Very Good</option>
                            <option value="3">3 - Average</option>
                            <option value="2">2 - Poor</option>
                            <option value="1">1 - Terrible</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Review Text</label>
                        <textarea id="reviewText" rows="3" required class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition">
                        Submit Review
                    </button>
                </form>
            </div>

            <!-- Recent Reviews Table / List -->
            <div class="lg:col-span-2 bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold">Recent Hotel Reviews</h3>
                    <input type="text" id="searchInput" onkeyup="filterReviews()" placeholder="Search reviews..." class="px-3 py-1.5 border border-slate-300 dark:border-slate-600 rounded-lg bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 dark:border-slate-700 text-xs text-slate-500 dark:text-slate-400 uppercase">
                                <th class="py-3 px-4">Hotel</th>
                                <th class="py-3 px-4">Rating</th>
                                <th class="py-3 px-4">Review</th>
                                <th class="py-3 px-4">Sentiment</th>
                            </tr>
                        </thead>
                        <tbody id="reviewsTableBody" class="divide-y divide-slate-100 dark:divide-slate-700 text-sm">
                            <!-- Dynamic content -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- JavaScript logic -->
    <script>
        let sentimentChartInstance = null;
        let ratingChartInstance = null;
        let allReviews = [];

        // Theme Toggle Implementation
        function toggleTheme() {
            const htmlElement = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                themeIcon.className = 'fa-solid fa-moon text-lg';
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.className = 'fa-solid fa-sun text-lg';
            }
            updateChartsTheme();
        }

        // Initialize theme on load
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const themeIcon = document.getElementById('themeIcon');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                if(themeIcon) themeIcon.className = 'fa-solid fa-sun text-lg';
            } else {
                document.documentElement.classList.remove('dark');
                if(themeIcon) themeIcon.className = 'fa-solid fa-moon text-lg';
            }
        })();

        async function fetchDashboardData() {
            try {
                const response = await fetch('/api/dashboard');
                const data = await response.json();
                updateKPIs(data.stats);
                updateCharts(data.stats);
                allReviews = data.reviews;
                renderReviews(allReviews);
            } catch (error) {
                console.error('Error fetching dashboard data:', error);
            }
        }

        function updateKPIs(stats) {
            document.getElementById('kpiTotalReviews').innerText = stats.total_reviews;
            document.getElementById('kpiAvgRating').innerText = stats.avg_rating.toFixed(1);
            document.getElementById('kpiPositive').innerText = stats.positive_count + ' (' + ((stats.positive_count / (stats.total_reviews || 1)) * 100).toFixed(0) + '%)';
            document.getElementById('kpiNegative').innerText = stats.negative_count + ' (' + ((stats.negative_count / (stats.total_reviews || 1)) * 100).toFixed(0) + '%)';
        }

        function getChartColors() {
            const isDark = document.documentElement.classList.contains('dark');
            return {
                textColor: isDark ? '#94a3b8' : '#64748b',
                gridColor: isDark ? '#334155' : '#e2e8f0'
            };
        }

        function updateCharts(stats) {
            const colors = getChartColors();

            // Sentiment Chart
            const sentimentCtx = document.getElementById('sentimentChart').getContext('2d');
            if (sentimentChartInstance) sentimentChartInstance.destroy();
            sentimentChartInstance = new Chart(sentimentCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Positive', 'Neutral', 'Negative'],
                    datasets: [{
                        data: [stats.positive_count, stats.neutral_count, stats.negative_count],
                        backgroundColor: ['#10b981', '#f59e0b', '#f43f5e'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: colors.textColor }
                        }
                    }
                }
            });

            // Rating Chart
            const ratingCtx = document.getElementById('ratingChart').getContext('2d');
            if (ratingChartInstance) ratingChartInstance.destroy();
            ratingChartInstance = new Chart(ratingCtx, {
                type: 'bar',
                data: {
                    labels: ['1 Star', '2 Stars', '3 Stars', '4 Stars', '5 Stars'],
                    datasets: [{
                        label: 'Review Count',
                        data: [stats.rating_1, stats.rating_2, stats.rating_3, stats.rating_4, stats.rating_5],
                        backgroundColor: '#0ea5e9',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            ticks: { color: colors.textColor },
                            grid: { display: false }
                        },
                        y: {
                            ticks: { color: colors.textColor },
                            grid: { color: colors.gridColor }
                        }
                    }
                }
            });
        }

        function updateChartsTheme() {
            fetchDashboardData();
        }

        function renderReviews(reviews) {
            const tbody = document.getElementById('reviewsTableBody');
            tbody.innerHTML = '';
            reviews.forEach(rev => {
                let badgeClass = 'bg-slate-100 text-slate-700 dark:bg-slate-700 dark:text-slate-300';
                if (rev.sentiment === 'Positive') badgeClass = 'bg-emerald-50 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400';
                else if (rev.sentiment === 'Negative') badgeClass = 'bg-rose-50 text-rose-700 dark:bg-rose-900/30 dark:text-rose-400';
                else if (rev.sentiment === 'Neutral') badgeClass = 'bg-amber-50 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400';

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 dark:hover:bg-slate-750 transition';
                tr.innerHTML = `
                    <td class="py-3 px-4 font-medium">${rev.hotel_name}</td>
                    <td class="py-3 px-4">${rev.rating} <i class="fa-solid fa-star text-amber-400 text-xs"></i></td>
                    <td class="py-3 px-4 text-slate-600 dark:text-slate-300 max-w-xs truncate">${rev.review_text}</td>
                    <td class="py-3 px-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeClass}">${rev.sentiment}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterReviews() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allReviews.filter(r => 
                r.hotel_name.toLowerCase().includes(query) || 
                r.review_text.toLowerCase().includes(query) ||
                r.sentiment.toLowerCase().includes(query)
            );
            renderReviews(filtered);
        }

        async function submitReview(event) {
            event.preventDefault();
            const payload = {
                hotel_name: document.getElementById('hotelName').value,
                rating: parseInt(document.getElementById('reviewRating').value),
                review_text: document.getElementById('reviewText').value
            };

            try {
                const response = await fetch('/api/reviews', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (response.ok) {
                    document.getElementById('reviewForm').reset();
                    fetchDashboardData();
                }
            } catch (error) {
                console.error('Error submitting review:', error);
            }
        }

        // Initial fetch on page load
        fetchDashboardData();
    </script>
</body>
</html>
