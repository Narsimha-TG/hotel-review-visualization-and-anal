<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Review Visualization and Analysis Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            color: #ffffff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #333;
            text-align: left;
        }
        th {
            background-color: #2c2c2c;
            color: #ffffff;
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #444;
            background-color: #2c2c2c;
            color: #ffffff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #bb86fc;
            color: #121212;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #9965f4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hotel Review Dashboard</h1>
        
        <div class="card">
            <h2>Analytics Summary</h2>
            <p id="total-reviews">Total Reviews: Loading...</p>
            <p id="avg-rating">Average Rating: Loading...</p>
        </div>

        <div class="card">
            <h2>Submit a New Review</h2>
            <form id="review-form">
                <label for="hotel_name">Hotel Name:</label>
                <input type="text" id="hotel_name" required>
                
                <label for="rating">Rating (1-5):</label>
                <input type="number" id="rating" min="1" max="5" required>
                
                <label for="comment">Comment:</label>
                <textarea id="comment" rows="4" required></textarea>
                
                <button type="submit">Submit Review</button>
            </form>
        </div>

        <div class="card">
            <h2>Reviews List</h2>
            <table>
                <thead>
                    <tr>
                        <th>Hotel</th>
                        <th>Rating</th>
                        <th>Comment</th>
                    </tr>
                </thead>
                <tbody id="reviews-table-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchHealth() {
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                console.log('Health:', data);
            } catch (err) {
                console.error('Health check failed', err);
            }
        }

        async function fetchAnalytics() {
            try {
                const res = await fetch('/api/analytics');
                const data = await res.json();
                document.getElementById('total-reviews').innerText = `Total Reviews: ${data.total_reviews}`;
                document.getElementById('avg-rating').innerText = `Average Rating: ${data.average_rating || 'N/A'}`;
            } catch (err) {
                console.error('Failed to fetch analytics', err);
            }
        }

        async function fetchReviews() {
            try {
                const res = await fetch('/api/reviews');
                const reviews = await res.json();
                const tbody = document.getElementById('reviews-table-body');
                tbody.innerHTML = '';
                reviews.forEach(r => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${r.hotel_name}</td><td>${r.rating}</td><td>${r.comment}</td>`;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('Failed to fetch reviews', err);
            }
        }

        document.getElementById('review-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const hotel_name = document.getElementById('hotel_name').value;
            const rating = parseInt(document.getElementById('rating').value);
            const comment = document.getElementById('comment').value;

            try {
                const res = await fetch('/api/reviews', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hotel_name, rating, comment })
                });
                if (res.status === 201) {
                    document.getElementById('review-form').reset();
                    fetchReviews();
                    fetchAnalytics();
                } else {
                    alert('Failed to submit review');
                }
            } catch (err) {
                console.error('Error submitting review', err);
            }
        });

        fetchHealth();
        fetchAnalytics();
        fetchReviews();
    </script>
</body>
</html>
