<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Review Visualization and Analysis Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .nav-btn {
            transition: all 0.2s ease-in-out;
        }
        .nav-btn:hover {
            background-color: #3b82f6;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .nav-btn.active {
            background-color: #2563eb;
            color: white;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">Hotel Analytics Dashboard</h1>
            <div id="nav-buttons" class="space-x-3 flex">
                <button onclick="switchTab('overview')" class="nav-btn active px-4 py-2 rounded-lg font-medium bg-gray-100 text-gray-700">Overview</button>
                <button onclick="switchTab('reviews')" class="nav-btn px-4 py-2 rounded-lg font-medium bg-gray-100 text-gray-700">Reviews</button>
                <button onclick="switchTab('analytics')" class="nav-btn px-4 py-2 rounded-lg font-medium bg-gray-100 text-gray-700">Analytics</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div id="tab-overview" class="tab-content">
            <h2 class="text-2xl font-semibold mb-4 text-gray-800">Dashboard Overview</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-gray-500 font-medium">Health Status</h3>
                    <p id="health-status" class="text-2xl font-bold text-green-600 mt-2">Checking...</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-gray-500 font-medium">Total Reviews</h3>
                    <p id="total-reviews" class="text-2xl font-bold text-blue-600 mt-2">-</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-gray-500 font-medium">Avg Rating</h3>
                    <p id="avg-rating" class="text-2xl font-bold text-yellow-600 mt-2">-</p>
                </div>
            </div>
        </div>

        <div id="tab-reviews" class="tab-content hidden">
            <h2 class="text-2xl font-semibold mb-4 text-gray-800">Submit & View Reviews</h2>
            <div class="bg-white p-6 rounded-lg shadow mb-6">
                <h3 class="text-lg font-medium mb-3">Add New Review</h3>
                <form id="review-form" onsubmit="submitReview(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Hotel Name</label>
                        <input type="text" id="hotel_name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Rating (1-5)</label>
                        <input type="number" id="rating" min="1" max="5" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Comment</label>
                        <textarea id="comment" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2"></textarea>
                    </div>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Submit Review</button>
                </form>
            </div>
        </div>

        <div id="tab-analytics" class="tab-content hidden">
            <h2 class="text-2xl font-semibold mb-4 text-gray-800">Detailed Analytics</h2>
            <div class="bg-white p-6 rounded-lg shadow">
                <pre id="analytics-data" class="bg-gray-50 p-4 rounded overflow-x-auto text-sm">Loading analytics...</pre>
            </div>
        </div>
    </main>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabName).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if (tabName === 'overview') loadOverview();
            if (tabName === 'analytics') loadAnalytics();
        }

        async function loadOverview() {
            try {
                const healthRes = await fetch('/api/health');
                const healthData = await healthRes.json();
                document.getElementById('health-status').innerText = healthData.status || 'OK';

                const analyticsRes = await fetch('/api/analytics');
                const analyticsData = await analyticsRes.json();
                document.getElementById('total-reviews').innerText = analyticsData.total_reviews ?? 0;
                document.getElementById('avg-rating').innerText = analyticsData.average_rating ?? 'N/A';
            } catch (e) {
                console.error(e);
            }
        }

        async function loadAnalytics() {
            try {
                const res = await fetch('/api/analytics');
                const data = await res.json();
                document.getElementById('analytics-data').innerText = JSON.stringify(data, null, 2);
            } catch (e) {
                document.getElementById('analytics-data').innerText = 'Failed to load analytics.';
            }
        }

        async function submitReview(e) {
            e.preventDefault();
            const payload = {
                hotel_name: document.getElementById('hotel_name').value,
                rating: parseInt(document.getElementById('rating').value),
                comment: document.getElementById('comment').value
            };

            const res = await fetch('/api/reviews', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.status === 201) {
                alert('Review submitted successfully!');
                document.getElementById('review-form').reset();
            } else {
                alert('Error submitting review');
            }
        }

        loadOverview();
    </script>
</body>
</html>
