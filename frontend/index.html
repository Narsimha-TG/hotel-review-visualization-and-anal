<!DOCTYPE html>
<html lang="" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Review Visualization and Analysis Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
    <div class="flex justify-between items-center px-8 py-4 border-b border-slate-200 dark:border-slate-800">
        <h1 class="text-2xl font-bold">Hotel Review Dashboard</h1>
        <button id="themeToggle" class="px-4 py-2 rounded-lg bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition">
            Toggle Dark/Light
        </button>
    </div>
    <main class="p-8 max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow">
            <h2 class="text-xl font-semibold mb-4">Analytics Overview</h2>
            <div id="analytics-summary" class="mb-4">
                <p>Total Reviews: <span id="total-reviews" class="font-bold">0</span></p>
            </div>
            <canvas id="analyticsChart"></canvas>
        </div>
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow">
            <h2 class="text-xl font-semibold mb-4">Submit a Review</h2>
            <form id="reviewForm" class="flex flex-col gap-4">
                <input type="text" id="hotel_name" placeholder="Hotel Name" required class="p-2 rounded border border-slate-300 dark:border-slate-700 bg-transparent">
                <textarea id="comment" placeholder="Your Review" required class="p-2 rounded border border-slate-300 dark:border-slate-700 bg-transparent"></textarea>
                <input type="number" id="rating" min="1" max="5" placeholder="Rating (1-5)" required class="p-2 rounded border border-slate-300 dark:border-slate-700 bg-transparent">
                <button type="submit" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition">Submit</button>
            </form>
        </div>
    </main>
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        themeToggle.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
        });

        async function loadAnalytics() {
            try {
                const response = await fetch('/api/analytics');
                const data = await response.json();
                document.getElementById('total-reviews').textContent = data.total_reviews || 0;
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const review = {
                hotel_name: document.getElementById('hotel_name').value,
                comment: document.getElementById('comment').value,
                rating: parseInt(document.getElementById('rating').value)
            };
            try {
                const response = await fetch('/api/reviews', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(review)
                });
                if (response.status === 201) {
                    alert('Review submitted successfully!');
                    loadAnalytics();
                    e.target.reset();
                }
            } catch (err) {
                console.error(err);
            }
        });

        loadAnalytics();
    </script>
</body>
</html>
