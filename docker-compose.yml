version: '3.8'

services:
  backend:
    build: ./backend
    container_name: hotel_review_backend
    ports:
      - "8000:8000"
    restart: always

  frontend:
    image: nginx:alpine
    container_name: hotel_review_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    restart: always
