<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Review Visualization & Analysis Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        accent: '#6366f1',
                        accentHover: '#4f46e5'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-darkBg text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300">

    <!-- Header -->
    <header class="bg-white dark:bg-cardBg shadow-sm border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-accent text-white p-2.5 rounded-xl shadow-lg shadow-accent/30">
                    <i class="fa-solid fa-hotel text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">HotelAnalytics</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Review Visualization & Intelligence</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div id="health-status" class="flex items-center space-x-2 px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-500 text-xs font-medium border border-emerald-500/20">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>System Healthy</span>
                </div>
                <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all">
                    <i class="fa-solid fa-moon dark:hidden text-slate-600"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- Stats Summary Section -->
        <section id="stats_summary" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="bg-white dark:bg-cardBg p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 flex items-center space-x-4">
                <div class="p-4 rounded-xl bg-blue-500/10 text-blue-500">
                    <i class="fa-solid fa-comments text-2xl"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium uppercase tracking-wider">Total Reviews</p>
                    <h3 id="stat-total-reviews" class="text-2xl font-bold mt-1">--</h3>
                </div>
            </div>
            <div class="bg-white dark:bg-cardBg p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 flex items-center space-x-4">
                <div class="p-4 rounded-xl bg-amber-500/10 text-amber-500">
                    <i class="fa-solid fa-star text-2xl"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium uppercase tracking-wider">Average Rating</p>
                    <h3 id="stat-avg-rating" class="text-2xl font-bold mt-1">--</h3>
                </div>
            </div>
            <div class="bg-white dark:bg-cardBg p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 flex items-center space-x-4">
                <div class="p-4 rounded-xl bg-emerald-500/10 text-emerald-500">
                    <i class="fa-solid fa-building text-2xl"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium uppercase tracking-wider">Hotels Tracked</p>
                    <h3 id="stat-total-hotels" class="text-2xl font-bold mt-1">--</h3>
                </div>
            </div>
            <div class="bg-white dark:bg-cardBg p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 flex items-center space-x-4">
                <div class="p-4 rounded-xl bg-purple-500/10 text-purple-500">
                    <i class="fa-solid fa-chart-line text-2xl"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium uppercase tracking-wider">Satisfaction Rate</p>
                    <h3 id="stat-satisfaction" class="text-2xl font-bold mt-1">--</h3>
                </div>
            </div>
        </section>

        <!-- Interactive Grid: Form & List -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Review Form Section -->
            <section id="review_form" class="lg:col-span-1">
                <div class="bg-white dark:bg-cardBg p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 sticky top-24">
                    <h2 class="text-lg font-bold mb-4 flex items-center space-x-2">
                        <i class="fa-solid fa-pen-to-square text-accent"></i>
                        <span>Add New Review</span>
                    </h2>
                    <form id="new-review-form" onsubmit="submitReview(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Hotel Name</label>
                            <input type="text" name="hotel_name" required placeholder="e.g. Grand Plaza" class="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 focus:outline-none focus:border-accent text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Author</label>
                            <input type="text" name="author" required placeholder="e.g. Jane Doe" class="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 focus:outline-none focus:border-accent text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Rating (1-5)</label>
                                <input type="number" name="rating" min="1" max="5" required placeholder="5" class="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 focus:outline-none focus:border-accent text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Date</label>
                                <input type="date" name="date" required class="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 focus:outline-none focus:border-accent text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Comment</label>
                            <textarea name="comment" rows="3" required placeholder="Share your experience..." class="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 focus:outline-none focus:border-accent text-sm"></textarea>
                        </div>
                        <button type="submit" class="w-full py-3 bg-accent hover:bg-accentHover text-white font-medium rounded-xl shadow-lg shadow-accent/20 transition-all transform active:scale-95">
                            Submit Review
                        </button>
                    </form>
                </div>
            </section>

            <!-- Review List Section -->
            <section id="review_list" class="lg:col-span-2 space-y-4">
                <div class="bg-white dark:bg-cardBg p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 flex justify-between items-center">
                    <h2 class="text-lg font-bold flex items-center space-x-2">
                        <i class="fa-solid fa-list text-accent"></i>
                        <span>Recent Reviews</span>
                    </h2>
                    <button onclick="loadDashboardData()" class="px-4 py-2 text-xs font-medium bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition-all">
                        <i class="fa-solid fa-rotate mr-1.5"></i> Refresh
                    </button>
                </div>
                <div id="reviews-container" class="space-y-4">
                    <!-- Dynamically populated reviews -->
                    <div class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                        <p class="text-sm">Loading analytics & reviews...</p>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- JavaScript App Logic -->
    <script>
        // Dark mode toggle functionality
        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        // Set default date to today
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            const dateInput = document.querySelector('input[name="date"]');
            if (dateInput) dateInput.value = today;
            loadDashboardData();
        });

        async function checkHealth() {
            try {
                const res = await fetch('/api/health');
                if (!res.ok) throw new Error();
                document.getElementById('health-status').className = 'flex items-center space-x-2 px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-500 text-xs font-medium border border-emerald-500/20';
                document.getElementById('health-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span>System Healthy</span>';
            } catch (e) {
                document.getElementById('health-status').className = 'flex items-center space-x-2 px-3 py-1.5 rounded-full bg-rose-500/10 text-rose-500 text-xs font-medium border border-rose-500/20';
                document.getElementById('health-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-500"></span><span>System Offline</span>';
            }
        }

        async function loadDashboardData() {
            checkHealth();
            await Promise.all([fetchAnalytics(), fetchReviews()]);
        }

        async function fetchAnalytics() {
            try {
                const res = await fetch('/api/analytics');
                const data = await res.json();
                
                // Fallback handling if structure varies slightly
                const totalReviews = data.total_reviews ?? data.count ?? 0;
                const avgRating = data.average_rating ?? data.avg_rating ?? 0;
                const totalHotels = data.total_hotels ?? data.hotels_count ?? 0;
                const satisfaction = data.satisfaction_rate ?? (avgRating ? ((avgRating / 5) * 100).toFixed(1) + '%' : '0%');

                document.getElementById('stat-total-reviews').innerText = totalReviews;
                document.getElementById('stat-avg-rating').innerText = Number(avgRating).toFixed(1);
                document.getElementById('stat-total-hotels').innerText = totalHotels;
                document.getElementById('stat-satisfaction').innerText = typeof satisfaction === 'number' ? satisfaction + '%' : satisfaction;
            } catch (err) {
                console.error('Failed to load analytics', err);
            }
        }

        async function fetchReviews() {
            const container = document.getElementById('reviews-container');
            try {
                const res = await fetch('/api/reviews');
                const reviews = await res.json();

                if (!reviews || reviews.length === 0) {
                    container.innerHTML = `
                        <div class="bg-white dark:bg-cardBg p-12 rounded-2xl text-center border border-slate-200 dark:border-slate-800">
                            <i class="fa-solid fa-folder-open text-3xl text-slate-400 mb-3"></i>
                            <p class="text-slate-500 dark:text-slate-400 text-sm">No reviews found. Submit the first review!</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = reviews.map(r => `
                    <div class="bg-white dark:bg-cardBg p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 space-y-3 transition-all hover:border-slate-300 dark:hover:border-slate-700">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="px-2.5 py-1 rounded-lg bg-accent/10 text-accent text-xs font-semibold">${escapeHtml(r.hotel_name)}</span>
                                <h3 class="font-bold mt-2 text-base">${escapeHtml(r.author)}</h3>
                            </div>
                            <div class="flex items-center space-x-1 bg-amber-500/10 px-2.5 py-1 rounded-lg text-amber-500 text-xs font-bold">
                                <i class="fa-solid fa-star"></i>
                                <span>${r.rating} / 5</span>
                            </div>
                        </div>
                        <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">${escapeHtml(r.comment)}</p>
                        <div class="text-xs text-slate-400 pt-2 border-t border-slate-100 dark:border-slate-800 flex justify-between">
                            <span>Reviewed on ${escapeHtml(r.date)}</span>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `
                    <div class="bg-rose-500/10 border border-rose-500/20 p-6 rounded-2xl text-center text-rose-500 text-sm">
                        Failed to load reviews. Please verify backend connection.
                    </div>
                `;
            }
        }

        async function submitReview(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            
            const payload = {
                hotel_name: formData.get('hotel_name'),
                author: formData.get('author'),
                rating: parseInt(formData.get('rating')),
                comment: formData.get('comment'),
                date: formData.get('date')
            };

            try {
                const res = await fetch('/api/reviews', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error('Submission failed');

                form.reset();
                const today = new Date().toISOString().split('T')[0];
                form.querySelector('input[name="date"]').value = today;
                
                loadDashboardData();
            } catch (err) {
                alert('Error submitting review. Please try again.');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
