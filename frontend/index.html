<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hotel Review Dashboard</title>
    <style>
        body { background-color: #e3f2fd; font-family: sans-serif; padding: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; color: white; cursor: pointer; margin: 5px; }
        .btn-primary { background-color: #007bff; }
        .btn-success { background-color: #28a745; }
        .btn-danger { background-color: #dc3545; }
        .btn-warning { background-color: #ffc107; color: black; }
    </style>
</head>
<body>
    <h1>Hotel Review Dashboard</h1>
    <button class="btn btn-primary">Fetch Reviews</button>
    <button class="btn btn-success">Analyze Data</button>
    <button class="btn btn-warning">Export Report</button>
    <button class="btn btn-danger">Clear Cache</button>
</body>
</html>
